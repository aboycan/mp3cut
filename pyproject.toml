[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mp3cut"
dynamic = ["version"]
description = "Cut, split or extract audio from any audio/video file into 320 kbps MP3 (FFmpeg-based)."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Madhu Kumar", email = "madhu.a@hotmail.com" }]
license = { text = "MIT" }
dependencies = []          # standard library only; needs FFmpeg + FFprobe on the system
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]

[project.scripts]
mp3cut = "mp3cutter.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mp3cutter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
